name: DH Android Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Assemble debug APK
        working-directory: dh-android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Locate APK
        run: |
          find dh-android/app/build/outputs -name '*.apk' -print
      - uses: actions/upload-artifact@v4
        with:
          name: dh-apk
          path: dh-android/app/build/outputs/apk/debug/*.apk
